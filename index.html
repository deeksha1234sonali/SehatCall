<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Your SehatCall dashboard: today's medicines, missed reminders and upcoming appointments.">
  <meta name="theme-color" content="#0d6e63">
  <title>Dashboard — SehatCall</title>

  <script>
    (function () {
      try {
        var pref = localStorage.getItem('sehatcall.theme');
        var dark = pref === 'dark' || (pref !== 'light' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.setAttribute('data-theme', 'dark');
        var scale = parseFloat(localStorage.getItem('sehatcall.textsize') || '1');
        if (scale && scale !== 1) document.documentElement.style.setProperty('--font-scale', String(scale));
      } catch (e) { /* storage blocked */ }
    })();
  </script>

  <link rel="stylesheet" href="/design-tokens.css">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to the main content</a>

  <div class="app-shell">
    <div id="sidebar-root"></div>

    <div class="shell-main">
      <header class="topbar">
        <button class="icon-btn menu-btn" type="button" id="menuBtn"
                aria-expanded="false" aria-controls="sidebar" aria-label="Open the menu">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 6h16M4 12h16M4 18h16"/>
          </svg>
        </button>

        <div class="topbar__heading">
          <h1 class="page-title" id="greeting">Dashboard</h1>
          <p class="page-subtitle" id="todayLine"></p>
        </div>

        <div class="topbar__actions">
          <a class="btn btn--primary" href="medicines.html?new=1">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12 5v14M5 12h14"/>
            </svg>
            <span>Add medicine</span>
          </a>
        </div>
      </header>

      <main class="page" id="main">
        <!-- Filled by js/dashboard.js -->
        <div id="notices"></div>

        <section class="page-section" aria-labelledby="overviewHeading">
          <h2 class="visually-hidden" id="overviewHeading">Overview</h2>
          <div class="stat-grid" id="statGrid"></div>
        </section>

        <section class="page-section" aria-labelledby="quickHeading">
          <div class="section-head">
            <h2 id="quickHeading">Quick actions</h2>
          </div>
          <div class="quick-actions">
            <a class="quick-action" href="medicines.html?new=1">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                   stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M10.5 20.5a6.36 6.36 0 0 1-9-9l7-7a6.36 6.36 0 0 1 9 9z"/>
                <path d="m8.5 13.5 5-5"/>
              </svg>
              <span>Add a medicine<small>Name, dose and times</small></span>
            </a>
            <a class="quick-action" href="appointments.html?new=1">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                   stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="3" y="4" width="18" height="18" rx="2"/>
                <path d="M16 2v4M8 2v4M3 10h18"/><path d="M12 14v4M10 16h4"/>
              </svg>
              <span>Book an appointment<small>Doctor, date and time</small></span>
            </a>
            <a class="quick-action" href="reminders.html">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                   stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>
              </svg>
              <span>Reminder history<small>What was taken, and when</small></span>
            </a>
            <button class="quick-action" type="button" id="exportToday">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                   stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                <path d="m7 10 5 5 5-5"/><path d="M12 15V3"/>
              </svg>
              <span>Save today's list<small>Download as a text file</small></span>
            </button>
          </div>
        </section>

        <div class="two-col page-section">
          <section class="card" aria-labelledby="dosesHeading">
            <div class="card__header">
              <div>
                <h2 class="card__title" id="dosesHeading">Today's medicines</h2>
                <p class="page-subtitle" id="dosesSummary"></p>
              </div>
              <a class="btn btn--quiet btn--sm" href="medicines.html">Manage</a>
            </div>
            <div class="card__body card__body--flush">
              <ul class="item-list" id="doseList"></ul>
            </div>
          </section>

          <section class="card" aria-labelledby="apptHeading">
            <div class="card__header">
              <div>
                <h2 class="card__title" id="apptHeading">Upcoming appointments</h2>
              </div>
              <a class="btn btn--quiet btn--sm" href="appointments.html">See all</a>
            </div>
            <div class="card__body card__body--flush">
              <ul class="item-list" id="apptList"></ul>
            </div>
            <div class="card__footer">
              <a class="btn btn--secondary btn--sm" href="appointments.html?new=1">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M12 5v14M5 12h14"/>
                </svg>
                <span>Book an appointment</span>
              </a>
            </div>
          </section>
        </div>
      </main>
    </div>
  </div>

  <div class="toast-region" id="toasts" role="status" aria-live="polite"></div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
